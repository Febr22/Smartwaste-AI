services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes: ["./models:/app/models:ro"]
    environment:
      MODEL_DIR: /app/models
      CORS_ORIGINS: http://localhost:5173
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [backend]
